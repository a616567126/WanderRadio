apply plugin: 'com.android.application'
android {
    namespace 'com.wanderadio.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.wanderadio.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.1.6'
        testInstrumentationRunner 'com.wanderadio.app.AtlasHighlightInstrumentation'
    }
    signingConfigs {
        debug {
            if (project.hasProperty('debugKeystore')) {
                storeFile file(project.property('debugKeystore'))
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
}
